<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sadarah</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light dark; --primary:#0c8d7e; --primary-2:#0a6f63; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; font-family: -apple-system, BlinkMacSystemFont,
      "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
      background: #f4faf8; color: #0a2723; padding: 24px; text-align: center;
    }
    @media (prefers-color-scheme: dark) { body { background: #05070f; color: #f5f7fb; } }
    a { color: var(--primary); font-weight: 700; text-decoration: none; }
    .logo { width: 72px; height: 72px; border-radius: 18px; }
    p { font-size: 15px; }
  </style>
  <script>
    // Path-shaped invite links (/join/<sessionId>?academy=...) have no static
    // file on GitHub Pages, so they land here — bounce them to the real
    // landing page's query form before anything renders.
    (function () {
      var m = window.location.pathname.match(/^\/join\/([^\/]+)\/?$/);
      if (m) {
        var academy = new URLSearchParams(window.location.search).get('academy');
        window.location.replace('/join/?s=' + encodeURIComponent(m[1]) +
          (academy ? ('&academy=' + encodeURIComponent(academy)) : ''));
      }
    })();
  </script>
</head>
<body>
  <div>
    <img class="logo" src="/assets/logo.png" alt="Sadarah">
    <p>Page not found — <a href="/">sadarahapp.com</a></p>
    <p dir="rtl" lang="ar">الصفحة غير موجودة — <a href="/ar.html">الصفحة الرئيسية</a></p>
  </div>
</body>
</html>
