<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open in Sadarah</title>
  <meta name="apple-itunes-app" content="app-id=6771104812">
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light dark; --primary:#0c8d7e; --primary-2:#0a6f63; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; font-family: -apple-system, BlinkMacSystemFont,
      "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
      background: #f4faf8; color: #0a2723; padding: 24px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #05070f; color: #f5f7fb; }
      .ghost { color: #7fd6ca !important; border-color: #0a5a52 !important; }
      p { color: #94a3b8 !important; }
    }
    .card { text-align: center; max-width: 360px; width: 100%; }
    .logo { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 22px; font-weight: 800; margin: 12px 0 4px; }
    p { color: #5b6f6b; font-size: 14px; margin: 0 0 24px; }
    .btn {
      display: block; width: 100%; padding: 14px 18px; border-radius: 14px;
      font-weight: 700; font-size: 15px; text-decoration: none; margin-top: 12px;
    }
    .primary { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; }
    .ghost { background: transparent; color: var(--primary-2); border: 1px solid var(--primary); }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/assets/logo.png" alt="Sadarah">
    <h1 id="title">Sadarah</h1>
    <p id="msg">Opening the app…</p>
    <a id="appBtn" class="btn ghost" href="#">Open in app</a>
    <a id="storeBtn" class="btn primary" href="#" style="display:none">Get the app</a>
  </div>

  <script>
    (function () {
      var ANDROID_STORE = 'https://play.google.com/store/apps/details?id=com.evoapp.sports';
      var IOS_STORE = 'https://apps.apple.com/app/id6771104812';

      var params = new URLSearchParams(window.location.search);
      // Query form: /join/?s=<sessionId>&academy=<academyId>. A path form
      // (/join/<sessionId>) lands on 404.html, which redirects here.
      var sessionId = params.get('s') || params.get('session') || '';
      var academy = params.get('academy') || '';
      var appUrl = 'evosports://join/' + encodeURIComponent(sessionId) +
                   (academy ? ('?academy=' + encodeURIComponent(academy)) : '');

      var ua = navigator.userAgent || '';
      var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      var isAndroid = /Android/.test(ua);
      var store = isIOS ? IOS_STORE : (isAndroid ? ANDROID_STORE : null);

      var lang = (navigator.language || '').toLowerCase();
      var ar = lang.indexOf('ar') === 0;
      var T = ar ? {
        opening: 'جارٍ فتح التطبيق…',
        invalid: 'رابط الدعوة هذا غير صالح.',
        onPhone: 'افتح هذه الدعوة على هاتفك للانضمام إلى الجلسة.',
        openApp: 'فتح التطبيق',
        getApp: 'تحميل التطبيق'
      } : {
        opening: 'Opening the app…',
        invalid: 'This invite link looks invalid.',
        onPhone: 'Open this invite on your phone to join the session.',
        openApp: 'Open in app',
        getApp: 'Get the app'
      };
      if (ar) {
        document.documentElement.lang = 'ar';
        document.documentElement.dir = 'rtl';
      }

      var appBtn = document.getElementById('appBtn');
      var storeBtn = document.getElementById('storeBtn');
      var msg = document.getElementById('msg');
      msg.textContent = T.opening;
      appBtn.textContent = T.openApp;
      storeBtn.textContent = T.getApp;
      appBtn.href = appUrl;
      if (store) storeBtn.href = store;

      if (!sessionId) {
        msg.textContent = T.invalid;
        appBtn.style.display = 'none';
        return;
      }
      if (!store) {
        msg.textContent = T.onPhone;
        return;
      }

      var start = Date.now();
      var fallback = setTimeout(function () {
        if (document.hidden) return;
        if (Date.now() - start > 2200) return;
        window.location.replace(store);
      }, 1400);

      function cancel() { clearTimeout(fallback); }
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) cancel();
      });
      window.addEventListener('pagehide', cancel);

      storeBtn.style.display = 'block';
      window.location.href = appUrl;
    })();
  </script>
</body>
</html>
